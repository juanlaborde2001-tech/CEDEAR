name: Actualizador Automatico de Datos Financieros

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 18:00 hs EST (Cierre de NY)
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic

jobs:
  build:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Ejecutar Script Financiero
        run: python run_model.py

      - name: Guardar y publicar JSON actualizado
        run: |
          git config --global user.name "Financial-Bot"
          git config --global user.email "bot@financialdashboard.com"
          git add data_master.json
          git commit -m "Auto-update data: $(date)" || exit 0
          git push
